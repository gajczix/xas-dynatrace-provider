apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: metricproviderclasses.xas.io
spec:
  group: xas.io
  names:
    kind: MetricProviderClass
    listKind: MetricProviderClassList
    plural: metricproviderclasses
    singular: metricproviderclass
    shortNames:
      - mpc
  scope: Cluster
  versions:
    - name: v1
      served: true
      storage: true
      schema:
        openAPIV3Schema:
          type: object
          properties:
            apiVersion:
              type: string
            kind:
              type: string
            metadata:
              type: object
            spec:
              type: object
              required:
                - type
              properties:
                type:
                  type: string
                  description: "Provider implementation type (e.g., Dynatrace, Prometheus, Kubelet)"
                config:
                  type: object
                  additionalProperties:
                    type: string
                  description: "Key-value configuration parameters passed to the provider"
