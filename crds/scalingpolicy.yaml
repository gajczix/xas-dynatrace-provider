apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: scalingpolicies.xas.io
spec:
  group: xas.io
  names:
    kind: ScalingPolicy
    listKind: ScalingPolicyList
    plural: scalingpolicies
    singular: scalingpolicy
    shortNames:
      - sp
  scope: Namespaced
  versions:
    - name: v1
      served: true
      storage: true
      schema:
        openAPIV3Schema:
          type: object
          properties:
            apiVersion:
              type: string
            kind:
              type: string
            metadata:
              type: object
            spec:
              type: object
              required:
                - scaleTargetRef
                - providerRef
                - strategy
                - horizontal
                - metrics
                - scaling
              properties:
                scaleTargetRef:
                  type: object
                  required:
                    - kind
                    - name
                  properties:
                    apiVersion:
                      type: string
                    kind:
                      type: string
                    name:
                      type: string
                providerRef:
                  type: object
                  required:
                    - name
                  properties:
                    name:
                      type: string
                strategy:
                  type: object
                  required:
                    - type
                  properties:
                    type:
                      type: string
                      enum:
                        - Horizontal
                        - Vertical
                        - Coordinated
                horizontal:
                  type: object
                  required:
                    - minReplicas
                    - maxReplicas
                  properties:
                    minReplicas:
                      type: integer
                      minimum: 1
                    maxReplicas:
                      type: integer
                      minimum: 1
                metrics:
                  type: array
                  items:
                    type: object
                    required:
                      - name
                      - metric
                    properties:
                      name:
                        type: string
                      metric:
                        type: string
                      entitySelector:
                        type: string
                scaling:
                  type: array
                  items:
                    type: object
                    required:
                      - recommender
                      - name
                      - params
                    properties:
                      recommender:
                        type: string
                      name:
                        type: string
                      params:
                        type: object
                        additionalProperties:
                          type: string
            status:
              type: object
              properties:
                currentMetricValue:
                  type: string
                currentReplicas:
                  type: integer
                desiredReplicas:
                  type: integer
                lastScaleTime:
                  type: string
                conditions:
                  type: array
                  items:
                    type: object
