apiVersion: apps/v1
kind: Deployment
metadata:
  name: sample-workload
  namespace: default
  labels:
    app: sample-workload
spec:
  replicas: 1
  selector:
    matchLabels:
      app: sample-workload
  template:
    metadata:
      labels:
        app: sample-workload
    spec:
      containers:
        - name: app
          image: mirror.gcr.io/library/nginx:alpine
          ports:
            - containerPort: 80
          resources:
            requests:
              cpu: 50m
              memory: 32Mi
            limits:
              cpu: 100m
              memory: 64Mi
